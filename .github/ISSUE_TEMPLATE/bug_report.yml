name: Bug report
description: Report incorrect or unexpected behavior in krt
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please provide a
        minimal reproducible example so the problem can be diagnosed quickly.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reprex
    attributes:
      label: Reproducible example
      description: A minimal `reprex::reprex()` that triggers the bug.
      render: r
    validations:
      required: true
  - type: textarea
    id: sessioninfo
    attributes:
      label: Session info
      description: Output of `sessionInfo()`.
      render: r
    validations:
      required: true
